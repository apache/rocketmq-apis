syntax = "proto3";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

import "apache/rocketmq/v2/definition.proto";

package apache.rocketmq.v2;

option cc_enable_arenas = true;
option csharp_namespace = "Apache.Rocketmq.V2";
option java_multiple_files = true;
option java_package = "apache.rocketmq.v2";
option java_generate_equals_and_hash = true;
option java_string_check_utf8 = true;
option java_outer_classname = "MQAdmin";

// Request to dynamically change the runtime log level of the server without a
// restart. Mainly used for on-demand troubleshooting.
message ChangeLogLevelRequest {
  enum Level {
    TRACE = 0;
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
    ERROR = 4;
  }
  Level level = 1;
}

message ChangeLogLevelResponse {
  // Human-readable result of the operation.
  string remark = 1;
}

// Request the status and metadata of a topic.
message DescribeTopicStatusRequest {
  // Identifies the target deployment (instance) in multi-tenant environments
  // where a single endpoint serves several isolated deployments.
  optional string deployment_name = 1;
  Resource topic = 2;
}

message DescribeTopicStatusResponse {
  Status status = 1;

  // The message type the topic accepts, e.g. NORMAL / FIFO / DELAY /
  // TRANSACTION. Derived from the topic configuration on the broker.
  MessageType topic_message_type = 2;

  // Optional description associated with the topic.
  optional string description = 3;

  // The time when the topic was created.
  optional google.protobuf.Timestamp create_timestamp = 4;

  // Extended attributes attached to the topic in key-value form.
  map<string, string> tags = 5;
}

// List subscription relationships filtered by topic and/or group.
// At least one of the two filters is expected to be set.
message ListSubscriptionRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  optional Resource topic = 2;
  optional Resource group = 3;
}

// A single subscription relationship between a group and a topic.
message SubscriptionInfo {
  Resource group = 1;
  Resource topic = 2;

  // The filter expression (TAG or SQL92) the subscription uses.
  FilterExpression expression = 3;

  // Whether there is at least one online consumer for this subscription.
  bool online = 4;

  // The last time this subscription was reported/updated.
  google.protobuf.Timestamp last_update_timestamp = 5;

  // The consumption model of the group, i.e. CLUSTERING or BROADCASTING.
  MessageModel message_model = 6;

  // Whether the subscription is consistent across all consumers of the group.
  bool subscription_consistency = 7;
}

message ListSubscriptionResponse {
  Status status = 1;
  repeated SubscriptionInfo subscription_info = 2;
}

// Describe subscription details grouped per connected client. Compared to
// ListSubscription, this returns the subscription reported by each individual
// client, which helps diagnose inconsistent subscriptions within a group.
message DescribeSubscriptionRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  optional Resource topic = 2;
  optional Resource group = 3;
}

message DescribeSubscriptionResponse {

  // Subscription as reported by one specific client.
  message ClientSubscriptionInfo {
    ClientInfo client_info = 1;
    SubscriptionInfo subscription_info = 2;
  }
  Status status = 1;
  repeated ClientSubscriptionInfo client_subscription_info = 2;
}

// Delete a subscription relationship between a group and a topic.
message DeleteSubscriptionRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource topic = 2;
  Resource group = 3;

  // The filter expression that identifies the subscription to delete.
  FilterExpression expression = 4;
}

message DeleteSubscriptionResponse {
  Status status = 1;
}

// Runtime information of a connected client (producer or consumer).
message ClientInfo {
  string client_id = 1;

  // Client SDK version.
  string version = 2;

  // Programming language of the client SDK.
  string language = 3;

  // Hostname of the client.
  string hostname = 4;

  // Source IP address observed by the server.
  string egress_ip = 5;

  // Consumption model, only meaningful for consumers.
  MessageModel message_model = 6;
}

// Consumption model of a consumer group.
enum MessageModel {
  MESSAGE_MODEL_UNSPECIFIED = 0;

  // Messages are load-balanced across all consumers within the group.
  CLUSTERING = 1;

  // Every consumer within the group receives the full stream of messages.
  BROADCASTING = 2;

  // Consumers of the group selectively subscribe to individual lite topics
  // that are multiplexed onto a shared physical topic.
  LITE_SELECTIVE = 3;
}

// A message queue together with the process queue snapshot held by a consumer.
message MessageQueueItem {
  MessageQueue message_queue = 1;
  ProcessQueueInfo process_queue_info = 2;
}

// Snapshot of a consumer-side process queue, describing local cache and
// offset watermarks for a single message queue.
message ProcessQueueInfo {
  int64 commit_offset = 1;
  int64 cached_msg_min_offset = 2;
  int64 cached_msg_max_offset = 3;
  int32 cached_msg_count = 4;
  int32 cached_msg_size_in_mib = 5;
  int64 transaction_msg_min_offset = 6;
  int64 transaction_msg_max_offset = 7;
  int32 transaction_msg_count = 8;
  bool locked = 9;
  int64 try_unlock_times = 10;
  int64 last_lock_timestamp = 11;
  bool dropped = 12;
  int64 last_pull_timestamp = 13;
  int64 last_consume_timestamp = 14;
}

// Consumption statistics reported by a consumer.
message ConsumeStatus {
  double receive_rt = 1;
  double receive_tps = 2;
  double consume_rt = 3;
  double consume_ok_tps = 4;
  double consume_failed_tps = 5;
  int64 consume_failed_msgs = 6;
}

// Aggregated running information of a consumer, reported on demand.
message ConsumerRunningInfo {
  // Arbitrary client properties, e.g. thread pool config, consume orderly, etc.
  map<string, string> properties = 1;

  // Subscriptions keyed by topic.
  map<string, FilterExpression> subscriptions = 2;

  // Per-queue process queue snapshots.
  repeated MessageQueueItem message_queue_table = 3;

  // Consumption statistics keyed by topic.
  map<string, ConsumeStatus> consume_status_table = 4;
}

// Query the message accumulation (lag) of a consumer group.
message DescribeGroupAccumulationRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource group = 2;

  // Optional set of topics to break the accumulation down by. When empty, the
  // aggregated accumulation of the whole group is returned.
  repeated Resource topics = 3;

  // Restrict the query to a single lite topic multiplexed onto the topics above.
  optional string lite_topic = 4;
}

message DescribeGroupAccumulationResponse {

  // Accumulation metrics of a group or a single topic.
  message GroupAccumulation {
    // Number of messages already delivered but not yet acknowledged.
    int64 inflight_messages = 1;

    // Number of messages ready to be delivered.
    int64 ready_messages = 2;

    // Total accumulation (inflight + ready).
    int64 accumulation = 3;

    // Estimated delay before the earliest ready message is delivered.
    google.protobuf.Duration deliver_delay_time = 4;

    // Timestamp of the last successful consumption.
    int64 last_consume_timestamp = 5;
  }
  Status status = 1;

  // Aggregated accumulation of the whole group.
  GroupAccumulation accumulation = 2;

  // Per-topic accumulation, keyed by topic name.
  map<string, GroupAccumulation> topic_accumulation = 3;

  // Per-lite-topic accumulation, keyed by lite topic name.
  map<string, GroupAccumulation> lite_topic_accumulation = 4;
}

// Query the time span of messages consumed by a group across its topics.
message QueryTimeSpanRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource group = 2;
  repeated Resource topics = 3;
}

message QueryTimeSpanResponse {

  // Time span of a single message queue.
  message QueueTimeSpan {
    MessageQueue message_queue = 1;

    // Store timestamp of the earliest message in the queue.
    int64 min_timestamp = 2;

    // Store timestamp of the latest message in the queue.
    int64 max_timestamp = 3;

    // Store timestamp corresponding to the current consume offset.
    int64 consume_timestamp = 4;

    // Consumption delay in milliseconds.
    int64 delay_time_ms = 5;
  }
  Status status = 1;
  repeated QueueTimeSpan queue_time_span_list = 2;
}

// List the online consumer connections of a group.
message ListConsumerConnectionRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource group = 2;

  // Optional topic filter.
  optional Resource topic = 3;

  // Optional lite topic filter, multiplexed onto the topic above.
  optional string liteTopic = 4;
}

message ListConsumerConnectionResponse {
  Status status = 1;
  repeated ClientInfo client_info = 2;
}

// Reset the consume offset of a group on a topic to the given timestamp.
message ResetGroupOffsetRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource group = 2;
  Resource topic = 3;

  // Messages stored at or after this timestamp will be re-consumed.
  google.protobuf.Timestamp reset_timestamp = 4;
}

message ResetGroupOffsetResponse {
  Status status = 1;
}

// Query messages of a topic by id, key or subscription within a time range.
message ListMessageRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource topic = 2;

  // Maximum number of messages to return.
  int32 max_message_nums = 3;

  // Time range (inclusive begin, inclusive end) to scan.
  google.protobuf.Timestamp begin_timestamp = 4;
  google.protobuf.Timestamp end_timestamp = 5;

  // The key used to locate messages. Exactly one should be set.
  oneof search_key {
    string message_id = 6;
    string message_key = 7;
    string subscription = 8;

    // Scan every message belonging to the given lite topic.
    string lite_topic = 14;
  }

  // Opaque cursor for scroll-style pagination, echoed from a previous response.
  optional string scroll_id = 9;

  // Page-style pagination parameters.
  optional int32 page_num = 10;
  optional int32 page_size = 11;

  // Restrict the query to a specific broker and queue.
  optional string broker_name = 12;
  optional int32 queue_id = 13;
}

message ListMessageResponse {
  Status status = 1;
  repeated Message messages = 2;

  // Cursor to be passed back to fetch the next page.
  string scroll_id = 3;
}

// Print the thread stack trace of a specific client, for diagnostics.
message PrintThreadStackTraceRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  string client_id = 2;
  Resource group = 3;
}

message PrintThreadStackTraceResponse {
  Status status = 1;
  optional string thread_stack_trace = 2;
}

// Ask a specific client to consume the given message once, to verify that the
// consumer logic works as expected.
message VerifyMessageRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  string client_id = 2;
  Resource group = 3;
  Resource topic = 4;
  string message_id = 5;
}

message VerifyMessageResponse {
  Status status = 1;
}

// Send a message from the admin side, typically used to send a test message
// from a console.
message AdminSendMessageRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource topic = 2;
  // Tag, which is optional.
  optional string tag = 3;
  // Message key
  optional string key = 4;
  // Message body
  bytes body = 5;
  // User-defined properties of the message.
  map<string, string> user_properties = 6;
  // System properties of the message.
  optional SystemProperties system_properties = 7;
  // Request-scoped extension information. Unknown entries should be ignored.
  // Known keys:
  // - protocol_type: Protocol used by the original producer (REMOTING or GRPC_V2).
  map<string, string> ext_info = 8;
}

message AdminSendMessageResponse {
  Status status = 1;

  // Id assigned to the sent message.
  string message_id = 2;
}

// Fetch the aggregated running information of a specific consumer client.
message GetConsumerRunningInfoRequest {
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource group = 2;
  string client_id = 3;
}

message GetConsumerRunningInfoResponse {
  Status status = 1;
  ConsumerRunningInfo consumer_running_info = 2;
}

// Query the route data of a topic.
message GetTopicRouteRequest {
  // Network type used to select the proper endpoints to return.
  enum NetworkType {
    INTERNAL = 0;
    INTERNET = 1;
    INTRANET = 2;
  }
  // Identifies the target deployment (instance) in multi-tenant environments.
  optional string deployment_name = 1;
  Resource topic = 2;
  NetworkType network_type = 3;

  // Protocol type the client speaks, e.g. "grpc" or "remoting".
  string protocol_type = 4;

  // Whether the request comes from a streaming client.
  bool stream_request_type = 5;

  // Address of the requesting client.
  string client_address = 6;
}

message GetTopicRouteResponse {
  Status status = 1;

  // Serialized route data (topic route table) as a JSON string.
  string topic_route_data = 2;
}

// Request runtime statistics of the serving process (proxy/broker gateway).
message GetProxyRuntimeStatsRequest {
}

message GetProxyRuntimeStatsResponse {
  Status status = 1;
  string proxy_name = 2;
  string version = 3;

  // Inbound throughput in messages per second.
  double in_tps = 4;

  // Outbound throughput in messages per second.
  double out_tps = 5;

  // Number of active connections.
  int64 connections = 6;

  // Number of connected producers.
  int64 producers = 7;

  // Number of connected consumers.
  int64 consumers = 8;
}

// Admin exposes control-plane operations for cluster administration and
// diagnostics over gRPC, complementing the data-plane MessagingService.
service Admin {
  // Dynamically change the server log level.
  rpc ChangeLogLevel(ChangeLogLevelRequest) returns (ChangeLogLevelResponse) {}

  // Describe the status and metadata of a topic.
  rpc DescribeTopicStatus(DescribeTopicStatusRequest) returns (DescribeTopicStatusResponse) {}

  // List subscription relationships filtered by topic and/or group.
  rpc ListSubscription(ListSubscriptionRequest) returns (ListSubscriptionResponse) {}

  // Describe subscriptions grouped per connected client.
  rpc DescribeSubscription(DescribeSubscriptionRequest) returns (DescribeSubscriptionResponse) {}

  // Delete a subscription relationship.
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse) {}

  // Query the message accumulation (lag) of a consumer group.
  rpc DescribeGroupAccumulation(DescribeGroupAccumulationRequest) returns (DescribeGroupAccumulationResponse) {}

  // List online consumer connections of a group.
  rpc ListConsumerConnection(ListConsumerConnectionRequest) returns (ListConsumerConnectionResponse) {}

  // Reset the consume offset of a group to a timestamp.
  rpc ResetGroupOffset(ResetGroupOffsetRequest) returns (ResetGroupOffsetResponse) {}

  // Query messages by id, key or subscription within a time range.
  rpc QueryMessage(ListMessageRequest) returns (ListMessageResponse) {}

  // Print the thread stack trace of a client.
  rpc PrintThreadStackTrace(PrintThreadStackTraceRequest) returns (PrintThreadStackTraceResponse) {}

  // Verify consumption of a message by a specific client.
  rpc VerifyMessage(VerifyMessageRequest) returns (VerifyMessageResponse) {}

  // Send a message from the admin side (e.g. a console test message).
  rpc AdminSendMessage(AdminSendMessageRequest) returns (AdminSendMessageResponse) {}

  // Fetch aggregated running information of a consumer client.
  rpc GetConsumerRunningInfo(GetConsumerRunningInfoRequest) returns (GetConsumerRunningInfoResponse) {}

  // Query the route data of a topic.
  rpc GetTopicRoute(GetTopicRouteRequest) returns (GetTopicRouteResponse) {}

  // Query the time span of messages consumed by a group.
  rpc QueryTimeSpan(QueryTimeSpanRequest) returns (QueryTimeSpanResponse) {}

  // Fetch runtime statistics of the serving process.
  rpc GetProxyRuntimeStats(GetProxyRuntimeStatsRequest) returns (GetProxyRuntimeStatsResponse) {}
}

// ===========================================================================
// RIP-2: Proxy Admin gRPC Interface Surface
// ---------------------------------------------------------------------------
// RIP-2 introduces a dedicated, independent Proxy Admin service so that
// control-plane operations (online client query, runtime config, client
// diagnostics, route-change subscriptions) are exposed over gRPC, isolated
// from the data-plane MessagingService. It complements the existing Admin
// service (which targets the broker control plane) and covers BOTH gRPC and
// Remoting clients connected to the Proxy (design decision D5).
//
// Design decisions (see RIP-2):
//   D1  Service placement: dedicated ProxyAdminService (Option B), separate
//       from the data-plane MessagingService and the broker-facing Admin.
//   D2  Authorization: ACL 2.0 resource types under `proxy.admin.*`, each
//       sub-module a distinct resource for least-privilege:
//         proxy.admin.client      (ListClients/DescribeClient/ByGroup/ByTopic)
//         proxy.admin.config      (DescribeProxyConfig/UpdateProxyConfig)
//         proxy.admin.connection  (KickClient/DisconnectChannel, high privilege)
//         proxy.admin.quota       (DescribeQuota/UpdateQuota, high privilege)
//         proxy.admin.route       (DescribeRouteTopology/SubscribeRouteEvents)
//       Credentials are carried in the gRPC REQUEST METADATA (the
//       `Authorization` header via the RIP-1 AUTH-01 AuthCallCredentials
//       mechanism), NOT in the request message body — auth stays decoupled
//       from the data plane and reuses the 5.0 ACL 2.0 baseline.
//       A global `proxyAdminEnable` kill switch disables the whole surface.
//   D3  Multi-proxy semantics: each Proxy returns its LOCAL view, tagged with
//       `proxy_endpoint` + `epoch` so a consumer (dashboard/CLI) can dedup.
//   D4  Pagination: cursor-based (`next_token`) for highly dynamic client
//       lists; offset-based (`page_num`/`page_size`) for diagnostic snapshots.
//   D5  Dual-protocol coverage: both gRPC and Remoting clients are included,
//       distinguished by the `protocol` field of ClientInstance.
//
// Milestones: M1 online client query, M2 runtime config, connection control,
// quota visualization & route/load-balance observation, M3 POP receipt handle
// diagnostics, M4 batch consumption diagnostics, plus a server-streaming
// SubscribeRouteEvents.
// ===========================================================================

// Scope of a proxy admin query. D3: a Proxy returns its local view by default;
// cluster-wide aggregation is left to the consumer (dashboard/CLI).
enum ProxyScope {
  PROXY_SCOPE_UNSPECIFIED = 0;
  // Query only the local Proxy node that serves the request.
  PROXY_SCOPE_LOCAL_PROXY = 1;
  // Query across all Proxy nodes (requires peer discovery; reserved).
  PROXY_SCOPE_ALL_PROXIES = 2;
  // Query a specific Proxy node identified by proxy_id (reserved).
  PROXY_SCOPE_PROXY_ID = 3;
}

// The protocol a connected client speaks to the Proxy (design decision D5).
enum ClientProtocol {
  CLIENT_PROTOCOL_UNSPECIFIED = 0;
  CLIENT_PROTOCOL_GRPC = 1;
  CLIENT_PROTOCOL_REMOTING = 2;
}

// Role of a client connection, mirroring the consumer/producer taxonomy.
enum ClientRole {
  CLIENT_ROLE_UNSPECIFIED = 0;
  CLIENT_ROLE_PRODUCER = 1;
  CLIENT_ROLE_PUSH_CONSUMER = 2;
  CLIENT_ROLE_SIMPLE_CONSUMER = 3;
}

// Route change event types emitted by SubscribeRouteEvents.
enum RouteChangeEventType {
  ROUTE_CHANGE_EVENT_TYPE_UNSPECIFIED = 0;
  // A broker has come online (registered with NameServer).
  BROKER_ONLINE = 1;
  // A broker has gone offline (unregistered from NameServer).
  BROKER_OFFLINE = 2;
  // Queue count changed (read or write queue nums scaled up/down).
  QUEUE_SCALE = 3;
  // A new topic has been created.
  TOPIC_CREATE = 4;
  // A topic has been deleted.
  TOPIC_DELETE = 5;
  // Full route snapshot sent on initial subscription.
  ROUTE_SNAPSHOT = 6;
}

// A single heartbeat record reported by a client telemetry stream.
message HeartbeatRecord {
  google.protobuf.Timestamp timestamp = 1;
  bool success = 2;
  string remark = 3;
}

// Authentication status of a client connection.
message AuthStatus {
  bool authenticated = 1;
  string username = 2;
  google.protobuf.Timestamp last_auth_time = 3;
  string failure_reason = 4;
}

// Per-topic consume progress for a client.
message ClientTopicProgress {
  string topic = 1;
  int64 lag = 2;
  google.protobuf.Duration latency = 3;
}

// Aggregated consume progress for a client.
message ClientConsumeProgress {
  int64 lag = 1;
  google.protobuf.Duration latency = 2;
  repeated ClientTopicProgress topic_progress = 3;
}

// Network information of a client connection.
message NetworkInfo {
  string local_address = 1;
  string remote_address = 2;
  google.protobuf.Duration rtt = 3;
  bool tls_enabled = 4;
}

// Publish settings reported by a producer client (mirrors SubscriptionEntry for consumers).
message PublishSettings {
  // Topics the producer publishes to.
  repeated Resource topics = 1;
  // Load balancing strategy, e.g. AVERAGE or AUTO.
  string load_balancer = 2;
}

// Basic information of a single client connection on the Proxy.
message ClientInstance {
  string client_id = 1;
  Language language = 2;
  string client_version = 3;
  ClientProtocol protocol = 4;
  string access_point = 5;
  google.protobuf.Timestamp connect_time = 6;
  google.protobuf.Timestamp last_active_time = 7;
  ClientRole role = 8;
  repeated string groups = 9;
  string auth_subject = 10;
  // Endpoint of the Proxy node that owns this local view (D3).
  string proxy_endpoint = 11;
  // Monotonic epoch of the Proxy node, for consumer-side dedup (D3).
  int64 epoch = 12;
  // Topics this client is associated with (subscribed or publishing). RIP-2 M1 minimum set.
  repeated string topics = 13;
}

// Detailed information of a single client connection.
message ClientDetail {
  ClientInstance instance = 1;
  Settings settings = 2;
  repeated SubscriptionEntry subscriptions = 3;
  repeated HeartbeatRecord recent_heartbeats = 4;
  AuthStatus auth_status = 5;
  ClientConsumeProgress consume_progress = 6;
  NetworkInfo network_info = 7;
  // Publish settings for producer clients (mirrors subscriptions for consumers).
  PublishSettings publish_settings = 8;
}

// Filter for ListClients.
message ClientFilter {
  optional Resource group = 1;
  optional Resource topic = 2;
  optional string client_id_prefix = 3;
  optional Language language = 4;
  optional ClientRole role = 5;
  optional google.protobuf.Timestamp connected_after = 6;
  optional google.protobuf.Timestamp connected_before = 7;
}

message ListClientsRequest {
  ClientFilter filter = 1;
  // Server-enforced max page size (e.g. 1000).
  int32 page_size = 2;
  // Opaque cursor for cursor-based pagination (D4).
  string next_token = 3;
  // Multi-proxy aggregation scope (D3): local vs cluster-wide query.
  ProxyScope scope = 4;
}

message ListClientsResponse {
  Status status = 1;
  repeated ClientInstance clients = 2;
  string next_token = 3;
  string proxy_endpoint = 4;
  int64 epoch = 5;
}

message DescribeClientRequest {
  string client_id = 1;
}

message DescribeClientResponse {
  Status status = 1;
  ClientDetail client_detail = 2;
}

message ListClientsByGroupRequest {
  Resource group = 1;
  int32 page_size = 2;
  string next_token = 3;
  // Multi-proxy aggregation scope (D3).
  ProxyScope scope = 4;
}

message ListClientsByGroupResponse {
  Status status = 1;
  repeated ClientInstance clients = 2;
  string next_token = 3;
  string proxy_endpoint = 4;
  int64 epoch = 5;
}

message ListClientsByTopicRequest {
  Resource topic = 1;
  int32 page_size = 2;
  string next_token = 3;
  // Multi-proxy aggregation scope (D3).
  ProxyScope scope = 4;
}

message ListClientsByTopicResponse {
  Status status = 1;
  repeated ClientInstance clients = 2;
  string next_token = 3;
  string proxy_endpoint = 4;
  int64 epoch = 5;
}

// ---- M2: Runtime config & connection management ----

// Snapshot of the proxy runtime configuration.
message ProxyRuntimeConfig {
  string proxy_mode = 1;
  string rocketmq_cluster_name = 2;
  string proxy_cluster_name = 3;
  string proxy_name = 4;
  string local_serve_addr = 5;
  string namesrv_addr = 6;
  int32 grpc_server_port = 10;
  int32 grpc_thread_pool_nums = 11;
  bool proxy_admin_enabled = 20;
  int32 proxy_admin_server_port = 21;
  int32 proxy_admin_thread_pool_nums = 22;
  int32 max_message_size = 50;
  google.protobuf.Duration default_invisible_time = 60;
  google.protobuf.Duration max_invisible_time = 61;
  google.protobuf.Duration min_invisible_time_for_recv = 62;
  google.protobuf.Duration max_delay_time = 63;
  bool tls_test_mode_enable = 90;
  string tls_key_path = 91;
  string tls_cert_path = 92;
  string metrics_exporter_type = 100;
  int32 metrics_prom_exporter_port = 101;
  bool trace_on = 102;
}

message DescribeProxyConfigRequest {}

message DescribeProxyConfigResponse {
  Status status = 1;
  ProxyRuntimeConfig config = 2;
}

message UpdateProxyConfigRequest {
  ProxyRuntimeConfig config = 1;
}

message UpdateProxyConfigResponse {
  Status status = 1;
  ProxyRuntimeConfig config = 2;
  // Field names (snake_case) that were actually changed.
  repeated string changed_fields = 3;
}

message KickClientRequest {
  // The unique client identifier to disconnect (required). RIP-2 M2 connection control.
  string client_id = 1;
  // Human-readable reason for the forced disconnection, used for audit (required).
  string reason = 2;
}

message KickClientResponse {
  Status status = 1;
  // Whether the client was found and successfully disconnected.
  bool disconnected = 2;
}

// Forcefully tear down a single transport channel (gRPC channel id or Remoting
// channel id), complementing KickClient which targets a logical client_id.
message DisconnectChannelRequest {
  // Transport channel identifier (required).
  string channel_id = 1;
  // Human-readable reason for the forced disconnection, used for audit (required).
  string reason = 2;
}

message DisconnectChannelResponse {
  Status status = 1;
  // Whether the channel was found and successfully disconnected.
  bool disconnected = 2;
}

// ---- M2: Rate limiting / quota visualization (ACL resource: proxy.admin.quota) ----

// Dimension a quota policy is scoped to.
enum QuotaDimension {
  QUOTA_DIMENSION_UNSPECIFIED = 0;
  QUOTA_DIMENSION_NAMESPACE = 1;
  QUOTA_DIMENSION_TOPIC = 2;
  QUOTA_DIMENSION_GROUP = 3;
}

// A single rate-limiting / quota policy with its effective threshold and
// recent trigger statistics. RIP-2 M2 quota visualization.
message QuotaPolicy {
  QuotaDimension dimension = 1;
  // The resource the policy applies to (namespace / topic / group).
  Resource resource = 2;
  // Metric the quota limits, e.g. TPS or THROUGHPUT_BYTES.
  string metric = 3;
  // Effective threshold of the quota.
  int64 limit = 4;
  // Current usage within the measurement window.
  int64 current_usage = 5;
  // Number of times the quota was triggered in the recent window.
  int32 recent_trigger_count = 6;
  // Measurement window for trigger statistics.
  google.protobuf.Duration window = 7;
}

message DescribeQuotaRequest {
  QuotaDimension dimension = 1;
  // The resource to query (namespace / topic / group). Empty = all.
  Resource resource = 2;
  // Multi-proxy aggregation scope (D3).
  ProxyScope scope = 3;
}

message DescribeQuotaResponse {
  Status status = 1;
  repeated QuotaPolicy policies = 2;
}

// Controlled quota adjustment. Bound to a high-privilege ACL 2.0 action.
message UpdateQuotaRequest {
  QuotaPolicy policy = 1;
  // Multi-proxy aggregation scope (D3).
  ProxyScope scope = 2;
}

message UpdateQuotaResponse {
  Status status = 1;
  QuotaPolicy policy = 2;
}

// ---- M3: POP receipt handle diagnostics ----

// POP lock ownership view for a (group, topic, queue) triple. RIP-2 M3 diagnostics.
message PopLockView {
  string group = 1;
  string topic = 2;
  int32 queue_id = 3;
  // Client/consumer currently holding the POP lock.
  string lock_owner = 4;
  bool locked = 5;
  google.protobuf.Timestamp acquire_time = 6;
}

// POP receipt handle diagnostic info for a single unacked message.
message PopReceiptHandleInfo {
  string group = 1;
  string topic = 2;
  int32 queue_id = 3;
  string message_id = 4;
  int64 queue_offset = 5;
  int32 reconsume_times = 6;
  int32 renew_times = 7;
  int32 renew_retry_times = 8;
  google.protobuf.Timestamp consume_timestamp = 9;
  string receipt_handle = 10;
  google.protobuf.Timestamp next_visible_time = 11;
  google.protobuf.Duration invisible_time = 12;
  string broker_name = 13;
  // Whether the invisible time has expired (about to be redelivered).
  bool is_expired = 14;
  // Consumer/client currently holding the POP lock for this message (lock view).
  string lock_owner = 15;
  // Trigger reason when the message is in NOT_CONSUME_YET state.
  string not_consume_yet_reason = 16;
}

// Group-level summary of POP receipt handles (aggregated per consumer group).
message PopReceiptHandleGroupSummary {
  string group = 1;
  int32 total_handles = 2;
  int32 total_messages = 3;
  int64 total_renew_times = 4;
  int64 total_renew_retry_times = 5;
  int32 expired_handles = 6;
  // Total ACK count observed for the group (POP ACK/NACK counters).
  int64 total_ack_count = 7;
  // Total NACK count observed for the group.
  int64 total_nack_count = 8;
  // POP lock ownership view per queue.
  repeated PopLockView lock_view = 9;
}

message DescribePopReceiptHandlesRequest {
  // Consumer group name (required).
  string group = 1;
  // Optional topic filter - only return handles for this topic.
  optional string topic = 2;
  // Pagination: page number starting from 1.
  int32 page_num = 3;
  // Pagination: page size, max 100.
  int32 page_size = 4;
}

message DescribePopReceiptHandlesResponse {
  Status status = 1;
  PopReceiptHandleGroupSummary summary = 2;
  repeated PopReceiptHandleInfo handles = 3;
  int32 total = 4;
  int32 page_num = 5;
  int32 page_size = 6;
}

// ---- M4: Batch consumption diagnostics ----

// Batch pull window state for a consumer channel. RIP-2 M4 diagnostics.
message BatchPullWindowState {
  int32 current_window_size = 1;
  int32 min_window_size = 2;
  int32 max_window_size = 3;
  // Whether the window is currently expanding.
  bool expanding = 4;
}

// Per-client batch consumption diagnostics (per-channel aggregation).
message BatchConsumeClientDiagnostics {
  string client_id = 1;
  string channel_id = 2;
  int32 unacked_message_count = 3;
  int32 unacked_handle_count = 4;
  int64 total_renew_times = 5;
  int64 total_renew_retry_times = 6;
  int32 expired_handle_count = 7;
  // Distribution of unacked messages by topic (topic -> count).
  map<string, int32> topic_distribution = 8;
  // Consumer type: PUSH or PULL (from ConsumerManager).
  string consume_type = 9;
  // Message model: CLUSTERING, BROADCASTING, or LITE_SELECTIVE.
  MessageModel message_model = 10;
  int32 receive_batch_size = 11;
  google.protobuf.Duration long_polling_timeout = 12;
  // Last measured RTT (from gRPC channel, -1 if unavailable).
  google.protobuf.Duration last_rtt = 13;
  google.protobuf.Timestamp connect_time = 14;
  // Batch pull window state (POP/Batch advanced semantics diagnostics).
  BatchPullWindowState batch_window = 15;
}

// Group-level summary of batch consumption diagnostics.
message BatchConsumeGroupSummary {
  string group = 1;
  int32 total_clients = 2;
  int32 total_unacked_messages = 3;
  int32 total_unacked_handles = 4;
  int32 total_expired_handles = 5;
  int64 total_renew_times = 6;
  int64 total_renew_retry_times = 7;
}

message DescribeBatchConsumeDiagnosticsRequest {
  // Consumer group name (required).
  string group = 1;
  // Optional topic filter - only count messages for this topic.
  optional string topic = 2;
  // Optional client ID filter - only return diagnostics for this client.
  optional string client_id = 3;
  int32 page_num = 4;
  int32 page_size = 5;
}

message DescribeBatchConsumeDiagnosticsResponse {
  Status status = 1;
  BatchConsumeGroupSummary summary = 2;
  repeated BatchConsumeClientDiagnostics diagnostics = 3;
  int32 total = 4;
  int32 page_num = 5;
  int32 page_size = 6;
}

// ---- Route change subscription (server-streaming) ----

message BrokerInfo {
  string cluster = 1;
  string broker_name = 2;
  // Map of broker_id -> broker_address.
  map<int64, string> broker_addrs = 3;
}

message QueueInfo {
  string broker_name = 1;
  int32 read_queue_nums = 2;
  int32 write_queue_nums = 3;
  Permission perm = 4;
}

// Complete route data for a topic at a point in time.
message TopicRouteSnapshot {
  string topic = 1;
  repeated BrokerInfo brokers = 2;
  repeated QueueInfo queues = 3;
}

// A single route change detected by the proxy.
message RouteChangeEvent {
  RouteChangeEventType event_type = 1;
  // Timestamp when the event was detected (epoch millis semantics via Timestamp).
  google.protobuf.Timestamp timestamp = 2;
  string topic = 3;
  string cluster = 4;
  string broker_name = 5;
  int64 broker_id = 6;
  string broker_address = 7;
  int32 previous_read_queue_nums = 8;
  int32 current_read_queue_nums = 9;
  int32 previous_write_queue_nums = 10;
  int32 current_write_queue_nums = 11;
  // Full route snapshot (set only for ROUTE_SNAPSHOT events).
  TopicRouteSnapshot route_snapshot = 12;
}

message SubscribeRouteEventsRequest {
  // Optional: subscribe to specific topics only (empty = all topics).
  repeated string topics = 1;
  // Optional: subscribe to specific event types only (empty = all types).
  repeated RouteChangeEventType event_types = 2;
}

message SubscribeRouteEventsResponse {
  Status status = 1;
  RouteChangeEvent event = 2;
}

// ---- M2: Route & load-balance observation (ACL resource: proxy.admin.route) ----

// A Proxy -> Broker link with health / failover state. RIP-2 M2 route observation.
message ProxyBrokerLink {
  string proxy_endpoint = 1;
  string broker_name = 2;
  string broker_address = 3;
  // Whether the link is healthy (failover / circuit-breaker state).
  bool healthy = 4;
  // Number of active connections on this link.
  int32 active_connections = 5;
}

// Load distribution and region-affinity for a broker.
message LoadBalanceInfo {
  string broker_name = 1;
  int32 read_queue_nums = 2;
  int32 write_queue_nums = 3;
  // Current load (e.g. in-flight requests or message rate).
  int64 current_load = 4;
  // Whether region-affinity routing is in effect for this broker.
  bool region_affinity = 5;
}

message DescribeRouteTopologyRequest {
  // Optional topic filter to narrow the topology view.
  optional Resource topic = 1;
  // Multi-proxy aggregation scope (D3).
  ProxyScope scope = 2;
}

message DescribeRouteTopologyResponse {
  Status status = 1;
  // Proxy -> Broker connection topology.
  repeated ProxyBrokerLink links = 2;
  // Load distribution across brokers.
  repeated LoadBalanceInfo load = 3;
}

// ProxyAdminService — RIP-2 control-plane interface for the RocketMQ Proxy.
// It is intentionally separate from MessagingService so that admin query
// traffic stays isolated from the data plane.
service ProxyAdminService {
  // M1: Online client query (ACL resource: proxy.admin.client)
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse) {}
  rpc DescribeClient(DescribeClientRequest) returns (DescribeClientResponse) {}
  rpc ListClientsByGroup(ListClientsByGroupRequest) returns (ListClientsByGroupResponse) {}
  rpc ListClientsByTopic(ListClientsByTopicRequest) returns (ListClientsByTopicResponse) {}

  // M2: Runtime config & connection management (ACL resource: proxy.admin.config)
  rpc DescribeProxyConfig(DescribeProxyConfigRequest) returns (DescribeProxyConfigResponse) {}
  rpc UpdateProxyConfig(UpdateProxyConfigRequest) returns (UpdateProxyConfigResponse) {}
  // Connection control (ACL resource: proxy.admin.connection, high privilege)
  rpc KickClient(KickClientRequest) returns (KickClientResponse) {}
  rpc DisconnectChannel(DisconnectChannelRequest) returns (DisconnectChannelResponse) {}
  // Quota visualization & controlled adjustment (ACL resource: proxy.admin.quota)
  rpc DescribeQuota(DescribeQuotaRequest) returns (DescribeQuotaResponse) {}
  rpc UpdateQuota(UpdateQuotaRequest) returns (UpdateQuotaResponse) {}

  // M3: POP receipt handle diagnostics
  rpc DescribePopReceiptHandles(DescribePopReceiptHandlesRequest) returns (DescribePopReceiptHandlesResponse) {}

  // M4: Batch consumption diagnostics
  rpc DescribeBatchConsumeDiagnostics(DescribeBatchConsumeDiagnosticsRequest) returns (DescribeBatchConsumeDiagnosticsResponse) {}

  // Server-streaming route change subscription.
  rpc SubscribeRouteEvents(SubscribeRouteEventsRequest) returns (stream SubscribeRouteEventsResponse) {}
  // Route & load-balance observation (ACL resource: proxy.admin.route)
  rpc DescribeRouteTopology(DescribeRouteTopologyRequest) returns (DescribeRouteTopologyResponse) {}
}
